<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JUMMP</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      overflow: hidden;
      background: #111;
    }
    .game-shell { width: min(800px, 100%); }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 1;
      border: 2px solid #000;
      background: #d8efff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <canvas
      id="game"
      width="800"
      height="400"
      tabindex="0"
      aria-label="JUMMP 跳跃游戏。点击开始，游戏中点击或按空格跳跃。"
    ></canvas>
  </main>

  <audio id="bgm" src="./audio/bgm.mp3" preload="auto" loop></audio>
  <audio id="jumpSound" src="./audio/jump.mp3" preload="auto"></audio>
  <audio id="gameoverSound" src="./audio/gameover.mp3" preload="auto"></audio>

  <script>
    "use strict";

    const LOGICAL_WIDTH = 800;
    const LOGICAL_HEIGHT = 400;
    const GROUND_Y = 270;
    const MAX_DELTA_SECONDS = 1 / 30;

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d", { alpha: false });
    const bgm = document.getElementById("bgm");
    const jumpSound = document.getElementById("jumpSound");
    const gameoverSound = document.getElementById("gameoverSound");

    const UI = Object.freeze({
      start: { x: 325, y: 220, w: 150, h: 60 },
      restart: { x: 325, y: 250, w: 150, h: 60 },
      sound: { x: 700, y: 320, w: 60, h: 60 }
    });

    const BASE_SPEED = Object.freeze({
      background: { sky: 48, far: 144, near: 312, ground: 576 },
      enemyNormal: 432,
      enemyFast: 720
    });

    const PHYSICS = Object.freeze({
      jumpVelocity: -480,
      riseGravity: 648,
      fallGravity: 900
    });

    const assetPromises = [];

    function loadImage(src) {
      const image = new Image();
      image.decoding = "async";
      assetPromises.push(new Promise((resolve, reject) => {
        image.addEventListener("load", () => resolve(image), { once: true });
        image.addEventListener("error", () => reject(new Error(`资源加载失败：${src}`)), { once: true });
      }));
      image.src = src;
      return image;
    }

    const images = {
      player: {
        run: [
          loadImage("./assets/player/run_01.PNG"),
          loadImage("./assets/player/run_02.PNG"),
          loadImage("./assets/player/run_03.PNG")
        ],
        jump: loadImage("./assets/player/jump.PNG")
      },
      enemy: [
        loadImage("./assets/enemy/enemy_01.PNG"),
        loadImage("./assets/enemy/enemy_02.png"),
        loadImage("./assets/enemy/enemy_03.PNG")
      ],
      background: {
        sky: loadImage("./assets/background/sky.png"),
        far: loadImage("./assets/background/far.png"),
        near: loadImage("./assets/background/near.png")
      },
      ground: loadImage("./assets/ground/ground_tile.png"),
      ui: {
        musicOn: loadImage("./assets/ui/music_on.PNG"),
        musicOff: loadImage("./assets/ui/music_off.PNG"),
        score: loadImage("./assets/ui/icon_score.PNG"),
        time: loadImage("./assets/ui/icon_time.PNG"),
        title: loadImage("./assets/ui/title.png"),
        start: loadImage("./assets/ui/button_start.png"),
        gameover: loadImage("./assets/ui/panel_gameover.PNG"),
        restart: loadImage("./assets/ui/button_restart.PNG")
      }
    };

    let state = "LOADING";
    let soundOn = true;
    let score = 0;
    let elapsedSeconds = 0;
    let animationSeconds = 0;
    let spawnElapsed = 0;
    let nextSpawnDelay = 1.65;
    let lastFrameTime = performance.now();
    let loadErrorMessage = "";

    const backgroundX = { sky: 0, far: 0, near: 0, ground: 0 };
    const enemies = [];
    const player = { x: 80, y: GROUND_Y, w: 40, h: 40, vy: 0, jumping: false };

    bgm.volume = 0.35;
    jumpSound.volume = 0.7;
    gameoverSound.volume = 0.8;

    function configureCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(LOGICAL_WIDTH * dpr);
      canvas.height = Math.round(LOGICAL_HEIGHT * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
    }

    function resetGame() {
      score = 0;
      elapsedSeconds = 0;
      animationSeconds = 0;
      spawnElapsed = 0;
      nextSpawnDelay = 1.65;
      enemies.length = 0;

      player.y = GROUND_Y;
      player.vy = 0;
      player.jumping = false;

      backgroundX.sky = 0;
      backgroundX.far = 0;
      backgroundX.near = 0;
      backgroundX.ground = 0;
    }

    function startGame() {
      if (state !== "START" && state !== "GAMEOVER") return;

      resetGame();
      state = "PLAYING";
      lastFrameTime = performance.now();
      canvas.focus({ preventScroll: true });

      if (soundOn) {
        bgm.currentTime = 0;
        bgm.play().catch(() => {});
      }
    }

    function playEffect(audio) {
      if (!soundOn) return;
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    function toggleSound() {
      soundOn = !soundOn;
      if (!soundOn) {
        bgm.pause();
        return;
      }
      if (state === "PLAYING") bgm.play().catch(() => {});
    }

    function tryJump() {
      if (state !== "PLAYING" || player.jumping) return;
      player.vy = PHYSICS.jumpVelocity;
      player.jumping = true;
      playEffect(jumpSound);
    }

    function gameOver() {
      if (state !== "PLAYING") return;
      state = "GAMEOVER";
      bgm.pause();
      playEffect(gameoverSound);
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function currentDifficulty() {
      return 1 + Math.min(elapsedSeconds / 60 * 0.35, 0.75);
    }

    function scheduleNextEnemy() {
      const difficulty = currentDifficulty();
      nextSpawnDelay = Math.max(0.9, randomBetween(1.2, 2.8) / difficulty);
    }

    function createEnemy() {
      const isFast = Math.random() < 0.2;
      const baseSpeed = isFast ? BASE_SPEED.enemyFast : BASE_SPEED.enemyNormal;
      enemies.push({
        x: LOGICAL_WIDTH,
        y: GROUND_Y,
        w: 40,
        h: 40,
        speed: baseSpeed * currentDifficulty(),
        image: images.enemy[Math.floor(Math.random() * images.enemy.length)]
      });
    }

    function collision(a, b) {
      const padding = 7;
      return (
        a.x + padding < b.x + b.w - padding &&
        a.x + a.w - padding > b.x + padding &&
        a.y + padding < b.y + b.h - padding &&
        a.y + a.h - padding > b.y + padding
      );
    }

    function wrap(value, size) {
      return ((value % size) + size) % size;
    }

    function update(deltaSeconds) {
      if (state !== "PLAYING") return;

      elapsedSeconds += deltaSeconds;
      animationSeconds += deltaSeconds;

      backgroundX.sky = wrap(backgroundX.sky - BASE_SPEED.background.sky * deltaSeconds, LOGICAL_WIDTH);
      backgroundX.far = wrap(backgroundX.far - BASE_SPEED.background.far * deltaSeconds, LOGICAL_WIDTH);
      backgroundX.near = wrap(backgroundX.near - BASE_SPEED.background.near * deltaSeconds, LOGICAL_WIDTH);
      backgroundX.ground = wrap(backgroundX.ground - BASE_SPEED.background.ground * deltaSeconds, 512);

      const gravity = player.vy < 0 ? PHYSICS.riseGravity : PHYSICS.fallGravity;
      player.vy += gravity * deltaSeconds;
      player.y += player.vy * deltaSeconds;

      if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.vy = 0;
        player.jumping = false;
      }

      spawnElapsed += deltaSeconds;
      if (spawnElapsed >= nextSpawnDelay) {
        createEnemy();
        spawnElapsed = 0;
        scheduleNextEnemy();
      }

      for (let i = enemies.length - 1; i >= 0; i -= 1) {
        const enemy = enemies[i];
        enemy.x -= enemy.speed * deltaSeconds;

        if (enemy.x < -80) {
          enemies.splice(i, 1);
          score += 1;
          continue;
        }

        if (collision(player, enemy)) {
          gameOver();
          break;
        }
      }
    }

    function drawLoopingImage(image, offset, y, width, height) {
      const x = -offset;
      ctx.drawImage(image, x, y, width, height);
      ctx.drawImage(image, x + width, y, width, height);
    }

    function drawLoadingScreen() {
      ctx.fillStyle = "#d8efff";
      ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      ctx.fillStyle = "#111";
      ctx.textAlign = "center";
      ctx.font = "bold 24px Arial, sans-serif";
      ctx.fillText(state === "ERROR" ? "资源加载失败" : "LOADING...", 400, 190);
      if (loadErrorMessage) {
        ctx.font = "16px Arial, sans-serif";
        ctx.fillText(loadErrorMessage, 400, 220);
      }
      ctx.textAlign = "left";
    }

    function draw() {
      ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

      if (state === "LOADING" || state === "ERROR") {
        drawLoadingScreen();
        return;
      }

      drawLoopingImage(images.background.sky, backgroundX.sky, 0, 800, 400);
      drawLoopingImage(images.background.far, backgroundX.far, 80, 800, 200);
      drawLoopingImage(images.background.near, backgroundX.near, 150, 800, 150);
      drawLoopingImage(images.ground, backgroundX.ground, 300, 512, 100);

      let playerImage = images.player.run[0];
      if (player.jumping) {
        playerImage = images.player.jump;
      } else if (state === "PLAYING") {
        const frame = Math.floor(animationSeconds / 0.12) % images.player.run.length;
        playerImage = images.player.run[frame];
      }
      ctx.drawImage(playerImage, player.x - 20, player.y - 50, 80, 80);

      for (const enemy of enemies) {
        ctx.drawImage(enemy.image, enemy.x - 15, enemy.y - 40, 70, 70);
      }

      ctx.drawImage(images.ui.score, 20, 15, 32, 32);
      ctx.font = "22px Arial, sans-serif";
      ctx.fillStyle = "#000";
      ctx.fillText(String(score), 60, 40);

      ctx.drawImage(images.ui.time, 650, 15, 32, 32);
      ctx.fillText(String(Math.floor(elapsedSeconds)), 690, 40);

      ctx.drawImage(soundOn ? images.ui.musicOn : images.ui.musicOff, UI.sound.x, UI.sound.y, UI.sound.w, UI.sound.h);

      if (state === "START") {
        ctx.drawImage(images.ui.title, 200, 70, 400, 120);
        ctx.drawImage(images.ui.start, UI.start.x, UI.start.y, UI.start.w, UI.start.h);
      }

      if (state === "GAMEOVER") {
        ctx.drawImage(images.ui.gameover, 200, 80, 400, 200);
        ctx.drawImage(images.ui.restart, UI.restart.x, UI.restart.y, UI.restart.w, UI.restart.h);
      }
    }

    function pointInRect(point, rect) {
      return (
        point.x >= rect.x &&
        point.x <= rect.x + rect.w &&
        point.y >= rect.y &&
        point.y <= rect.y + rect.h
      );
    }

    function getCanvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * LOGICAL_WIDTH / rect.width,
        y: (event.clientY - rect.top) * LOGICAL_HEIGHT / rect.height
      };
    }

    canvas.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      const point = getCanvasPoint(event);

      if (pointInRect(point, UI.sound) && state !== "LOADING" && state !== "ERROR") {
        toggleSound();
        return;
      }

      if (state === "START") {
        if (pointInRect(point, UI.start)) startGame();
        return;
      }

      if (state === "GAMEOVER") {
        if (pointInRect(point, UI.restart)) startGame();
        return;
      }

      tryJump();
    });

    window.addEventListener("keydown", (event) => {
      if (event.code !== "Space" && event.code !== "ArrowUp" && event.code !== "Enter") return;
      event.preventDefault();

      if (state === "START" || state === "GAMEOVER") {
        startGame();
      } else {
        tryJump();
      }
    });

    window.addEventListener("resize", configureCanvas);

    document.addEventListener("visibilitychange", () => {
      lastFrameTime = performance.now();
      if (document.hidden) {
        bgm.pause();
      } else if (state === "PLAYING" && soundOn) {
        bgm.play().catch(() => {});
      }
    });

    function loop(now) {
      const deltaSeconds = Math.min((now - lastFrameTime) / 1000, MAX_DELTA_SECONDS);
      lastFrameTime = now;
      update(deltaSeconds);
      draw();
      requestAnimationFrame(loop);
    }

    configureCanvas();
    requestAnimationFrame(loop);

    Promise.all(assetPromises)
      .then(() => {
        state = "START";
      })
      .catch((error) => {
        state = "ERROR";
        loadErrorMessage = error.message;
        console.error(error);
      });
  </script>
</body>
</html>
