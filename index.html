<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>JUMMP</title>

<style>

html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#111;

display:flex;

justify-content:center;
align-items:center;

overflow:hidden;

}

canvas{

display:block;

width:min(100vw, 800px);
height:auto;

border:2px solid #000;

touch-action:none;

}

</style>

</head>


<body>


<canvas id="game" width="800" height="400"></canvas>


<audio id="bgm" src="audio/bgm.mp3" loop></audio>

<audio id="jumpSound" src="audio/jump.mp3"></audio>

<audio id="gameoverSound" src="audio/gameover.mp3"></audio>


<script>


const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d");


ctx.imageSmoothingEnabled = true;


// ==================================================
// 图片加载
// ==================================================

function load(src){

    const img = new Image();

    img.src = src;

    return img;

}


const img = {

    player: {

        run: [

            load("assets/player/run_01.PNG"),
            load("assets/player/run_02.PNG"),
            load("assets/player/run_03.PNG")

        ],

        jump:
        load("assets/player/jump.PNG")

    },


    enemy: [

        load("assets/enemy/enemy_01.PNG"),
        load("assets/enemy/enemy_02.png"),
        load("assets/enemy/enemy_03.PNG")

    ],


    bg: {

        sky:
        load("assets/background/sky.png"),

        far:
        load("assets/background/far.png"),

        near:
        load("assets/background/near.png")

    },


    ground:
    load("assets/ground/ground_tile.png"),


    ui: {

        musicOn:
        load("assets/ui/music_on.PNG"),

        musicOff:
        load("assets/ui/music_off.PNG"),

        score:
        load("assets/ui/icon_score.PNG"),

        time:
        load("assets/ui/icon_time.PNG"),

        title:
        load("assets/ui/title.png"),

        start:
        load("assets/ui/button_start.png"),

        gameover:
        load("assets/ui/panel_gameover.PNG"),

        restart:
        load("assets/ui/button_restart.PNG")

    }

};


// ==================================================
// 背景
// ==================================================

let bgX = {

    sky: 0,
    far: 0,
    near: 0,
    ground: 0

};


// 原来是每帧移动多少像素
// 这里换算成每秒移动多少像素
//
// 原来的数值 × 60 ≈ 60FPS下的速度

const bgSpeed = {

    sky: 0.2 * 60,
    far: 0.6 * 60,
    near: 1.3 * 60,
    ground: 2.4 * 60

};


// ==================================================
// 音乐
// ==================================================

let musicOn = true;


function playSound(id){

    const audio = document.getElementById(id);

    audio.currentTime = 0;

    audio.play().catch(() => {});

}


function toggleMusic(){

    const bgm = document.getElementById("bgm");

    musicOn = !musicOn;


    if(musicOn){

        bgm.play().catch(() => {});

    }else{

        bgm.pause();

    }

}


// ==================================================
// 游戏参数
// ==================================================

let state = "START";


let score = 0;

let time = 0;

let gameTime = 0;


// ==================================================
// 玩家
// ==================================================

const player = {

    x: 80,

    y: 270,

    w: 40,

    h: 40,

    vy: 0,

    jump: false,

    animTimer: 0,

    runFrame: 0

};


// ==================================================
// 跳跃参数
// ==================================================
//
// 按照原来60FPS下的手感换算
//
// 原：
// jumpPower = -8
// riseGravity = 0.18
// fallGravity = 0.25
//
// 转换成“每秒”
// ==================================================

const jumpPower = -8 * 60;


// 每秒速度变化
const riseGravity = 0.18 * 60 * 60;

const fallGravity = 0.25 * 60 * 60;


// ==================================================
// 敌人
// ==================================================

let enemies = [];


// 原来的：
// normalSpeed = 1.8 / frame
// fastSpeed = 3.1 / frame
//
// 换算成每秒

let normalSpeed = 1.8 * 60;

let fastSpeed = 3.1 * 60;


// 最大速度

const normalMaxSpeed = 2.5 * 60;

const fastMaxSpeed = 4.5 * 60;


// ==================================================
// 敌人生成
// ==================================================

// 原来 220 frame ≈ 3.67秒

let spawnTimer = 0;

let spawnInterval = 220 / 60;


// ==================================================
// 难度
// ==================================================

let difficultyTimer = 0;


// ==================================================
// 跑步动画
// ==================================================

// 原来的 Date.now()/120
// 保持每120ms切换一次

const runFrameDuration = 0.12;


// ==================================================
// Canvas坐标
// ==================================================

function getCanvasPosition(e){

    const rect = canvas.getBoundingClientRect();

    const scaleX = canvas.width / rect.width;

    const scaleY = canvas.height / rect.height;


    return {

        x: (e.clientX - rect.left) * scaleX,

        y: (e.clientY - rect.top) * scaleY

    };

}


// ==================================================
// 点击 / 手机触摸
// ==================================================

canvas.addEventListener("pointerdown", function(e){

    e.preventDefault();


    const pos = getCanvasPosition(e);

    const x = pos.x;

    const y = pos.y;


    // -----------------------------
    // 音乐按钮
    // -----------------------------

    if(

        x > 700 &&
        y > 320

    ){

        toggleMusic();

        return;

    }


    // -----------------------------
    // GAME OVER重新开始
    // -----------------------------

    if(state === "GAMEOVER"){

        if(

            x > 325 &&
            x < 475 &&
            y > 250 &&
            y < 310

        ){

            restart();

        }

        return;

    }


    // -----------------------------
    // 开始 / 跳跃
    // -----------------------------

    jump();

});


// ==================================================
// 跳跃
// ==================================================

function jump(){

    // START界面点击
    if(state === "START"){

        start();

        return;

    }


    // 游戏中跳跃
    if(

        state === "PLAYING" &&
        !player.jump

    ){

        player.vy = jumpPower;

        player.jump = true;

        playSound("jumpSound");

    }

}


// ==================================================
// 开始游戏
// ==================================================

function start(){

    state = "PLAYING";


    score = 0;

    time = 0;

    gameTime = 0;

    difficultyTimer = 0;


    enemies = [];


    // 玩家重置

    player.y = 270;

    player.vy = 0;

    player.jump = false;

    player.animTimer = 0;

    player.runFrame = 0;


    // 敌人生成重置

    spawnTimer = 0;

    spawnInterval = 220 / 60;


    // 速度重置
    //
    // 这一点很重要：
    // 防止GAME OVER后重新开始时
    // 速度沿用上一局

    normalSpeed = 1.8 * 60;

    fastSpeed = 3.1 * 60;


    // 背景重置

    bgX.sky = 0;
    bgX.far = 0;
    bgX.near = 0;
    bgX.ground = 0;


    // BGM

    const bgm = document.getElementById("bgm");


    if(musicOn){

        bgm.volume = 0.35;

        if(bgm.paused){

            bgm.play().catch(() => {});

        }

    }

}


// ==================================================
// 重新开始
// ==================================================

function restart(){

    start();

}


// ==================================================
// 创建敌人
// ==================================================

function createEnemy(){

    let speed;


    if(Math.random() < 0.2){

        speed = fastSpeed;

    }else{

        speed = normalSpeed;

    }


    enemies.push({

        x: 800,

        y: 270,

        w: 40,

        h: 40,

        speed: speed,

        img:
        img.enemy[
            Math.floor(Math.random() * 3)
        ]

    });

}


// ==================================================
// 碰撞
// ==================================================

function collision(a,b){

    return (

        a.x < b.x + b.w &&

        a.x + a.w > b.x &&

        a.y < b.y + b.h &&

        a.y + a.h > b.y

    );

}


// ==================================================
// 更新
// ==================================================

function update(dt){

    if(state !== "PLAYING")

        return;


    // ==================================================
    // 游戏时间
    // ==================================================

    gameTime += dt;

    time = Math.floor(gameTime);


    // ==================================================
    // 背景
    // ==================================================

    bgX.sky -= bgSpeed.sky * dt;

    bgX.far -= bgSpeed.far * dt;

    bgX.near -= bgSpeed.near * dt;

    bgX.ground -= bgSpeed.ground * dt;


    if(bgX.sky <= -800)

        bgX.sky += 800;


    if(bgX.far <= -800)

        bgX.far += 800;


    if(bgX.near <= -800)

        bgX.near += 800;


    if(bgX.ground <= -512)

        bgX.ground += 512;


    // ==================================================
    // 玩家跳跃
    // ==================================================

    if(player.vy < 0){

        player.vy += riseGravity * dt;

    }else{

        player.vy += fallGravity * dt;

    }


    player.y += player.vy * dt;


    if(player.y >= 270){

        player.y = 270;

        player.vy = 0;

        player.jump = false;

    }


    // ==================================================
    // 跑步动画
    // ==================================================

    if(!player.jump){

        player.animTimer += dt;


        while(player.animTimer >= runFrameDuration){

            player.animTimer -= runFrameDuration;


            player.runFrame++;


            if(player.runFrame >= 3){

                player.runFrame = 0;

            }

        }

    }else{

        // 跳跃结束以后从第一帧开始跑

        player.animTimer = 0;

        player.runFrame = 0;

    }


    // ==================================================
    // 难度增加
    // ==================================================

    difficultyTimer += dt;


    // 真正每10秒增加一次
    while(difficultyTimer >= 10){

        difficultyTimer -= 10;


        if(normalSpeed < normalMaxSpeed){

            normalSpeed += 0.002 * 60 * 60;

            normalSpeed =
                Math.min(
                    normalSpeed,
                    normalMaxSpeed
                );

        }


        if(fastSpeed < fastMaxSpeed){

            fastSpeed += 0.003 * 60 * 60;

            fastSpeed =
                Math.min(
                    fastSpeed,
                    fastMaxSpeed
                );

        }

    }


    // ==================================================
    // 敌人生成
    // ==================================================

    spawnTimer += dt;


    if(spawnTimer >= spawnInterval){

        createEnemy();


        spawnTimer = 0;


        // 原来的：
        // 160 + Math.random()*150 frame
        //
        // 换成秒

        spawnInterval =
            (
                160 +
                Math.random() * 150
            ) / 60;

    }


    // ==================================================
    // 敌人移动
    // ==================================================

    for(let i = enemies.length - 1; i >= 0; i--){

        const e = enemies[i];


        e.x -= e.speed * dt;


        // 敌人离开屏幕

        if(e.x < -80){

            enemies.splice(i,1);

            score++;

            continue;

        }


        // 碰撞

        if(collision(player,e)){

            gameOver();

            return;

        }

    }

}


// ==================================================
// 游戏结束
// ==================================================

function gameOver(){

    if(state === "GAMEOVER")

        return;


    state = "GAMEOVER";


    const bgm = document.getElementById("bgm");


    // 暂停BGM
    // 保留当前位置

    bgm.pause();


    playSound("gameoverSound");

}


// ==================================================
// 绘制
// ==================================================

function draw(){

    ctx.clearRect(

        0,
        0,
        800,
        400

    );


    // ==================================================
    // 天空
    // ==================================================

    ctx.drawImage(

        img.bg.sky,

        bgX.sky,

        0,

        800,

        400

    );


    ctx.drawImage(

        img.bg.sky,

        bgX.sky + 800,

        0,

        800,

        400

    );


    // ==================================================
    // 远景
    // ==================================================

    ctx.drawImage(

        img.bg.far,

        bgX.far,

        80,

        800,

        200

    );


    ctx.drawImage(

        img.bg.far,

        bgX.far + 800,

        80,

        800,

        200

    );


    // ==================================================
    // 近景
    // ==================================================

    ctx.drawImage(

        img.bg.near,

        bgX.near,

        150,

        800,

        150

    );


    ctx.drawImage(

        img.bg.near,

        bgX.near + 800,

        150,

        800,

        150

    );


    // ==================================================
    // 地面
    // ==================================================

    ctx.drawImage(

        img.ground,

        bgX.ground,

        300,

        512,

        100

    );


    ctx.drawImage(

        img.ground,

        bgX.ground + 512,

        300,

        512,

        100

    );


    // ==================================================
    // 玩家
    // ==================================================

    let playerImg;


    if(player.jump){

        playerImg = img.player.jump;

    }else{

        playerImg =
            img.player.run[player.runFrame];

    }


    ctx.drawImage(

        playerImg,

        player.x - 20,

        player.y - 50,

        80,

        80

    );


    // ==================================================
    // 敌人
    // ==================================================

    enemies.forEach(e => {

        ctx.drawImage(

            e.img,

            e.x - 15,

            e.y - 40,

            70,

            70

        );

    });


    // ==================================================
    // SCORE
    // ==================================================

    ctx.drawImage(

        img.ui.score,

        20,

        15,

        32,

        32

    );


    ctx.font = "22px Arial";

    ctx.fillStyle = "#000";


    ctx.fillText(

        score,

        60,

        40

    );


    // ==================================================
    // TIME
    // ==================================================

    ctx.drawImage(

        img.ui.time,

        650,

        15,

        32,

        32

    );


    ctx.fillText(

        time,

        690,

        40

    );


    // ==================================================
    // 音乐按钮
    // ==================================================

    ctx.drawImage(

        musicOn
        ? img.ui.musicOn
        : img.ui.musicOff,

        700,

        320,

        60,

        60

    );


    // ==================================================
    // START界面
    // ==================================================

    if(state === "START"){

        ctx.drawImage(

            img.ui.title,

            200,

            70,

            400,

            120

        );


        ctx.drawImage(

            img.ui.start,

            325,

            220,

            150,

            60

        );

    }


    // ==================================================
    // GAME OVER
    // ==================================================

    if(state === "GAMEOVER"){

        ctx.drawImage(

            img.ui.gameover,

            200,

            80,

            400,

            200

        );


        ctx.drawImage(

            img.ui.restart,

            325,

            250,

            150,

            60

        );

    }

}


// ==================================================
// DeltaTime 游戏循环
// ==================================================

let lastTime = performance.now();


function loop(currentTime){

    // ==================================================
    // 计算真实经过的时间
    // ==================================================

    let dt =
        (currentTime - lastTime) / 1000;


    lastTime = currentTime;


    // ==================================================
    // 防止手机卡顿后瞬移
    // 最大只允许一次计算50ms
    // ==================================================

    dt = Math.min(dt, 0.05);


    update(dt);

    draw();


    requestAnimationFrame(loop);

}


// ==================================================
// 开始循环
// ==================================================

requestAnimationFrame(loop);


</script>

</body>

</html>
