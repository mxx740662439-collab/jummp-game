<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>JUMMP</title>


<style>

body{

margin:0;

background:#111;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}


canvas{

border:2px solid #000;

}

</style>


</head>


<body>


<canvas id="game" width="800" height="400"></canvas>



<audio id="bgm" src="audio/bgm.mp3" loop></audio>

<audio id="jumpSound" src="audio/jump.mp3"></audio>

<audio id="gameoverSound" src="audio/gameover.mp3"></audio>



<script>


const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");





// =====================
// 图片加载
// =====================


function load(src){

let img=new Image();

img.src=src;

return img;

}







let img={



player:{


run:[

load("assets/player/run_01.PNG"),

load("assets/player/run_02.PNG"),

load("assets/player/run_03.PNG")

],


jump:

load("assets/player/jump.PNG")

},






enemy:[


load("assets/enemy/enemy_01.PNG"),

load("assets/enemy/enemy_02.png"),

load("assets/enemy/enemy_03.PNG")

],






bg:{


sky:

load("assets/background/sky.png"),


far:

load("assets/background/far.png"),


near:

load("assets/background/near.png")

},







ground:

load("assets/ground/ground_tile.png"),








ui:{



musicOn:

load("assets/ui/music_on.PNG"),



musicOff:

load("assets/ui/music_off.PNG"),




score:

load("assets/ui/icon_score.PNG"),



time:

load("assets/ui/icon_time.PNG"),



title:

load("assets/ui/title.png"),



start:

load("assets/ui/button_start.png"),



gameover:

load("assets/ui/panel_gameover.PNG"),



restart:

load("assets/ui/button_restart.PNG")



}


};








// =====================
// 背景循环变量
// =====================


let bgX={


sky:0,

far:0,

near:0,

ground:0


};




let bgSpeed={


sky:0.2,

far:0.6,

near:1.3,

ground:2.4


};









// =====================
// 音乐
// =====================


let musicOn=true;




function playSound(id){


let a=document.getElementById(id);


a.currentTime=0;


a.play().catch(()=>{});


}





function toggleMusic(){


let bgm=document.getElementById("bgm");


musicOn=!musicOn;



if(musicOn){


bgm.play().catch(()=>{});


}else{


bgm.pause();


}


}









// =====================
// 游戏参数
// =====================


let state="START";



let score=0;


let time=0;







let player={


x:80,


y:270,


w:40,


h:40,


vy:0,


jump:false


};







// 跳跃参数

let jumpPower=-8;


let riseGravity=0.18;


let fallGravity=0.25;








let enemies=[];



let normalSpeed=1.8;


let fastSpeed=3.1;



let spawnTimer=0;


let spawnInterval=220;



let startTime;



// =====================
// 点击控制
// =====================


canvas.addEventListener(

"mousedown",

e=>{


let rect=canvas.getBoundingClientRect();


let x=e.clientX-rect.left;

let y=e.clientY-rect.top;





// 音乐按钮


if(

x>700 &&

y>320

){


toggleMusic();


return;


}





// GAMEOVER重新开始


if(state==="GAMEOVER"){



if(

x>325 &&

x<475 &&

y>250 &&

y<310

){


restart();


}



return;


}





jump();


}

);










// =====================
// 跳跃
// =====================


function jump(){



if(state==="START"){


start();


return;


}





if(state==="PLAYING" && !player.jump){



player.vy=jumpPower;


player.jump=true;



playSound("jumpSound");


}



}









// =====================
// 开始游戏
// =====================


function start(){



state="PLAYING";



score=0;


time=0;



enemies=[];




player.y=270;


player.vy=0;


player.jump=false;





spawnTimer=0;


spawnInterval=220;



startTime=Date.now();






let bgm=document.getElementById("bgm");



if(musicOn && bgm.paused){


bgm.volume=.35;


bgm.play().catch(()=>{});


}



}








function restart(){


start();


}









// =====================
// 创建敌人
// =====================


function createEnemy(){



let speed;



if(Math.random()<0.2){


speed=fastSpeed;



}else{


speed=normalSpeed;


}








enemies.push({


x:800,


y:270,


w:40,


h:40,


speed:speed,



img:

img.enemy[

Math.floor(

Math.random()*3

)

]



});



}









// =====================
// 碰撞
// =====================


function collision(a,b){


return(


a.x < b.x+b.w &&


a.x+a.w > b.x &&


a.y < b.y+b.h &&


a.y+a.h > b.y


);



}











// =====================
// 更新
// =====================


function update(){



if(state!=="PLAYING")

return;






time=Math.floor(

(Date.now()-startTime)/1000

);







// ---------------------
// 背景移动
// ---------------------



bgX.sky-=bgSpeed.sky;


bgX.far-=bgSpeed.far;


bgX.near-=bgSpeed.near;


bgX.ground-=bgSpeed.ground;






if(bgX.sky<=-800)

bgX.sky=0;



if(bgX.far<=-800)

bgX.far=0;




if(bgX.near<=-800)

bgX.near=0;




if(bgX.ground<=-512)

bgX.ground+=512;









// ---------------------
// 玩家跳跃
// ---------------------



if(player.vy<0){



player.vy+=riseGravity;



}else{



player.vy+=fallGravity;



}




player.y+=player.vy;






if(player.y>=270){



player.y=270;


player.vy=0;


player.jump=false;



}










// ---------------------
// 难度增加
// ---------------------


if(time>0 && time%10===0){



if(normalSpeed<2.5){


normalSpeed+=0.002;


}



if(fastSpeed<4.5){


fastSpeed+=0.003;


}



}









// ---------------------
// 生成敌人
// ---------------------


spawnTimer++;



if(spawnTimer>spawnInterval){



createEnemy();



spawnTimer=0;



spawnInterval=

160+

Math.random()*150;



}









// ---------------------
// 敌人移动
// ---------------------


enemies.forEach((e,i)=>{



e.x-=e.speed;






if(e.x<-80){



enemies.splice(i,1);



score++;



}







if(collision(player,e)){



gameOver();



}




});



}
// =====================
// 游戏结束
// =====================


function gameOver(){



state="GAMEOVER";



let bgm=document.getElementById("bgm");



// 暂停BGM，保留播放位置

bgm.pause();



playSound("gameoverSound");



}









// =====================
// 绘制
// =====================


function draw(){



ctx.clearRect(

0,

0,

800,

400

);






// =====================
// 背景循环绘制
// =====================



// 天空

ctx.drawImage(

img.bg.sky,

bgX.sky,

0,

800,

400

);



ctx.drawImage(

img.bg.sky,

bgX.sky+800,

0,

800,

400

);






// 远景

ctx.drawImage(

img.bg.far,

bgX.far,

80,

800,

200

);



ctx.drawImage(

img.bg.far,

bgX.far+800,

80,

800,

200

);







// 近景

ctx.drawImage(

img.bg.near,

bgX.near,

150,

800,

150

);



ctx.drawImage(

img.bg.near,

bgX.near+800,

150,

800,

150

);








// =====================
// 地面循环
// =====================


ctx.drawImage(

img.ground,

bgX.ground,

300,

512,

100

);



ctx.drawImage(

img.ground,

bgX.ground+512,

300,

512,

100

);









// =====================
// 玩家动画
// =====================


let playerImg;



if(player.jump){



playerImg=img.player.jump;



}else{



let frame=

Math.floor(Date.now()/120)%3;



playerImg=

img.player.run[frame];



}







ctx.drawImage(


playerImg,


player.x-20,


player.y-50,


80,


80


);









// =====================
// 敌人
// =====================


enemies.forEach(e=>{



ctx.drawImage(


e.img,


e.x-15,


e.y-40,


70,


70


);



});









// =====================
// SCORE
// =====================


ctx.drawImage(

img.ui.score,

20,

15,

32,

32

);



ctx.font="22px Arial";


ctx.fillStyle="#000";



ctx.fillText(

score,

60,

40

);









// =====================
// TIME
// =====================


ctx.drawImage(

img.ui.time,

650,

15,

32,

32

);



ctx.fillText(

time,

690,

40

);









// =====================
// 音乐按钮
// =====================


ctx.drawImage(


musicOn?

img.ui.musicOn:

img.ui.musicOff,



700,

320,

60,

60


);









// =====================
// 标题界面
// =====================


if(state==="START"){



ctx.drawImage(


img.ui.title,


200,


70,


400,


120


);






ctx.drawImage(


img.ui.start,


325,


220,


150,


60


);



}









// =====================
// GAME OVER
// =====================


if(state==="GAMEOVER"){



ctx.drawImage(


img.ui.gameover,


200,


80,


400,


200


);





ctx.drawImage(


img.ui.restart,


325,


250,


150,


60


);



}



}









// =====================
// 循环
// =====================


function loop(){



update();



draw();



requestAnimationFrame(loop);



}



loop();



</script>


</body>


</html>
